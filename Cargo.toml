[workspace]
resolver = "2"
members = [
    "crates/plottypus-core",
    "crates/plottypus-metrics",
    "crates/plottypus-ui",
    "crates/plottypus",
]
default-members = ["crates/plottypus"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/CLoaKY233/plottypus-mac"
rust-version = "1.88"

[workspace.dependencies]
plottypus-core = { path = "crates/plottypus-core" }
plottypus-metrics = { path = "crates/plottypus-metrics" }
plottypus-ui = { path = "crates/plottypus-ui" }
crossterm = "0.28"
libc = "0.2"
ratatui = "0.30"
thiserror = "2"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"
exit = "deny"
large_enum_variant = "warn"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
