name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: "1"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1

  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: macos-aarch64
          - os: ubuntu-latest
            asset: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p plottypus
      - name: Package
        run: |
          name="plottypus-${GITHUB_REF_NAME}-${{ matrix.asset }}"
          mkdir -p dist
          cp target/release/plottypus "dist/${name}"
          tar -C dist -czf "${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: plottypus-${{ github.ref_name }}-${{ matrix.asset }}
          path: plottypus-*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/plottypus-*.tar.gz)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no release assets" >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --generate-notes --title "${GITHUB_REF_NAME}"
          fi
